<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Curso 25-26</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      font-family: Inter, sans-serif;
      background:#050816;
      color:white;
      overflow-x:hidden;
    }

    /* ---------------- BACKGROUND ---------------- */

    .background{
      position:fixed;
      inset:0;
      z-index:-3;

      background:
      linear-gradient(rgba(5,8,22,0.70), rgba(5,8,22,0.92)),
      url("/1-BACHB/grupo.jpg");

      background-size:cover;
      background-position:center;

      transform:scale(1.08);

      animation:slowZoom 25s ease-in-out infinite alternate;
    }

    @keyframes slowZoom{
      from{
        transform:scale(1.08);
      }

      to{
        transform:scale(1.15);
      }
    }

    .overlay{
      position:fixed;
      inset:0;
      z-index:-2;

      backdrop-filter:blur(6px);
    }

    .particles{
      position:fixed;
      inset:0;
      z-index:-1;

      background-image:
      radial-gradient(rgba(255,255,255,0.12) 1px, transparent 1px);

      background-size:40px 40px;

      opacity:0.18;

      animation:moveParticles 40s linear infinite;
    }

    @keyframes moveParticles{
      from{
        transform:translate(0,0);
      }

      to{
        transform:translate(-200px,-200px);
      }
    }

    /* ---------------- HERO ---------------- */

    .hero{
      min-height:100vh;

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;

      text-align:center;

      padding:40px 20px;
    }

    h1{
      font-size:6rem;
      font-weight:800;

      letter-spacing:-4px;

      margin-bottom:25px;

      animation:fadeUp 1.2s ease;
    }

    .phrase{
      max-width:850px;

      font-size:1.4rem;
      line-height:1.9;

      color:rgba(255,255,255,0.88);

      animation:fadeUp 1.5s ease;
    }

    .scroll{
      position:absolute;
      bottom:40px;

      font-size:0.95rem;
      letter-spacing:2px;
      text-transform:uppercase;

      color:rgba(255,255,255,0.55);

      animation:float 2.5s ease-in-out infinite;
    }

    @keyframes float{
      0%{
        transform:translateY(0);
      }

      50%{
        transform:translateY(8px);
      }

      100%{
        transform:translateY(0);
      }
    }

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(30px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    /* ---------------- GALLERY ---------------- */

    .gallery-section{
      width:100%;
      max-width:1200px;

      margin:auto;

      padding:80px 20px 120px;
    }

    .gallery-title{
      text-align:center;

      font-size:2.2rem;
      font-weight:700;

      margin-bottom:70px;

      color:white;
    }

    .gallery{
      display:grid;

      grid-template-columns:
      repeat(auto-fit, minmax(260px, 1fr));

      gap:40px;
    }

    .photo{
      background:rgba(255,255,255,0.08);

      padding:16px 16px 60px;

      border-radius:26px;

      backdrop-filter:blur(12px);

      border:1px solid rgba(255,255,255,0.08);

      box-shadow:
      0 10px 40px rgba(0,0,0,0.35);

      transition:0.45s ease;

      position:relative;
    }

    .photo:nth-child(odd){
      transform:rotate(-2deg);
    }

    .photo:nth-child(even){
      transform:rotate(2deg);
    }

    .photo:hover{
      transform:rotate(0deg) scale(1.03);
    }

    .photo img{
      width:100%;
      height:380px;

      object-fit:cover;

      border-radius:18px;

      display:block;
    }

    .photo-text{
      position:absolute;

      bottom:18px;
      left:0;
      right:0;

      text-align:center;

      color:rgba(255,255,255,0.75);

      font-size:0.95rem;

      letter-spacing:1px;
    }

    /* ---------------- FOOTER ---------------- */

    footer{
      text-align:center;

      padding:0 20px 70px;

      color:rgba(255,255,255,0.42);

      font-size:0.95rem;

      letter-spacing:2px;
      text-transform:uppercase;
    }

    /* ---------------- MOBILE ---------------- */

    @media(max-width:768px){

      h1{
        font-size:3.8rem;
        letter-spacing:-2px;
      }

      .phrase{
        font-size:1.08rem;
        line-height:1.8;
      }

      .gallery-title{
        font-size:1.7rem;
      }

      .photo img{
        height:320px;
      }

    }

  </style>
</head>
<body>

  <!-- FONDO -->
  <div class="background"></div>
  <div class="overlay"></div>
  <div class="particles"></div>

  <!-- HERO -->
  <section class="hero">

    <!-- NOMBRE -->
    <h1>Blanca</h1>

    <!-- FRASE -->
    <p class="phrase">
      Hay personas que hacen que incluso los días normales
      terminen convirtiéndose en recuerdos bonitos.
      Gracias por formar parte de este pequeño caos llamado 1º Bach.
    </p>

    <div class="scroll">
      ↓ recuerdos ↓
    </div>

  </section>

  <!-- GALERÍA -->
  <section class="gallery-section">

    <h2 class="gallery-title">
      Algunos momentos ✨
    </h2>

    <div class="gallery">

      <!-- FOTO 1 -->
      <div class="photo">
        <img src="/1BachB/blanca1.jpg">
        <div class="photo-text">
          un recuerdo más :)
        </div>
      </div>

      <!-- FOTO 2 -->
      <div class="photo">
        <img src="/1BachB/blanca2.jpg">
        <div class="photo-text">
          2025 — 2026
        </div>
      </div>

      <!-- FOTO 3 -->
      <div class="photo">
        <img src="/1BachB/blanca2.jpg">
        <div class="photo-text">
          2025 — 2026
        </div>
      </div>
      

    </div>

  </section>

  <!-- FOOTER -->
  <footer>
    1º Bachillerato · 2025 — 2026
  </footer>

</body>
</html>
